site_name: predylogic
repo_url: https://github.com/Nagato-Yuzuru/predylogic
site_url: https://Nagato-Yuzuru.github.io/predylogic
site_description: Deferred Execution Composable Predicate Tool.
site_author: Nagato Yuzuru
edit_uri: edit/main/docs/
repo_name: Nagato-Yuzuru/predylogic
copyright: Maintained by <a href="https://Nagato-Yuzuru.com">Nagato-Yuzuru</a>.

# Dev artifacts that live under docs/ but must not be published to the site.
exclude_docs: |
  superpowers/

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Guides:
      - Overview: guides/index.md
      - "Schema & Serde": guides/serde.md
      - Hot Reloading: guides/hot-reload.md
      - Tracing: guides/trace.md
      - "Composition & Performance": guides/composition.md
  - Reference: reference.md
  - Design:
      - Overview: design/index.md
      - "ADR 001: Evaluation Engine": design/adr/001_evaluation_engine.md
      - "ADR 002: AST Compiler Optimization": design/adr/002_AST_compiler_optimization.md

plugins:
  - search
  # resolve_closest makes a cross-reference resolve to the closest page in the
  # current language build (zh refs -> zh/reference, en refs -> reference). The
  # API reference is rendered once per locale (English content via fallback), so
  # without this every API symbol would have two URLs and autorefs would abort
  # the strict build with "Multiple primary URLs". This is the intended
  # multi-language behaviour, not a warning to silence.
  - autorefs:
      resolve_closest: true
  # i18n: folder structure (docs/en, docs/zh). English is the default/fallback
  # language; any page or asset missing in zh falls back to en. The API
  # reference (reference.md) lives only under docs/en and therefore stays
  # English in every locale. reconfigure_search auto-adds en+zh to the search
  # index (zh segmentation via jieba); reconfigure_material adds the language
  # switcher — both default on.
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Quick Start: 快速开始
            Guides: 指南
            "Schema & Serde": Schema 与序列化
            Hot Reloading: 热更新
            Tracing: Trace 追踪
            "Composition & Performance": 组合与性能
            Reference: API 参考
            Design: 设计
            Overview: 概览
            "ADR 001: Evaluation Engine": "ADR 001:求值引擎"
            "ADR 002: AST Compiler Optimization": "ADR 002:AST 编译优化"
  - mkdocstrings:
      handlers:
        python:
          paths: [ "sdks/python/src" ]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_category_heading: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - custom-skip-class
      auto_caption: true
      caption_position: bottom


theme:
  name: material
  features:
    - content.code.copy
    - navigation.tabs
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nagato-Yuzuru/predylogic
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/predylogic

markdown_extensions:
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Resolve `--8<-- "README.md:badges"` against the repo root so the docs
      # homepages can transclude the single badge block defined in the README.
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
