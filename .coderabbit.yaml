# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config for predylogic. Reviews PRs to the default branch; the
# path_instructions below are self-contained (no external guideline file).
language: "en-US"
tone_instructions: >-
  Be precise and concrete; cite file:line and exact symbols. Prioritize
  correctness, type-safety, and the fast-path performance contract over
  stylistic nitpicks already enforced by ruff/ty/tach. No filler or praise.

reviews:
  profile: "assertive"
  request_changes_workflow: false # advisory only; CI stays the merge gate
  high_level_summary: true
  review_status: true
  poem: false

  auto_review:
    enabled: true
    drafts: false

  # Only negations, so everything not listed here is still reviewed.
  path_filters:
    - "!sdks/python/src/predylogic/_version.py" # generated by hatch-vcs
    - "!**/*.lock" # uv.lock, Cargo.lock
    - "!sdks/python/prof/**" # profiling output
    - "!**/__pycache__/**"

  # All matching entries apply (a file under predicate/ gets both the
  # hot-path and the general-SDK instructions).
  path_instructions:
    - path: "sdks/python/src/predylogic/predicate/**"
      instructions: >-
        This is the performance-critical core. Preserve the zero-abstraction
        fast path: flag anything that adds allocation, recursion, or a Python
        frame call to Predicate.__call__ when trace=True is not set — trace is
        the slow path, the fast path must stay zero-overhead. Preserve the
        contravariance of Predicate[T] (T_contra). N-ary operations (all_of /
        any_of) must build FLAT N-ary Trace nodes, not left-leaning binary
        chains. Changes here should be benchmarked against the CodSpeed baseline.
    - path: "sdks/python/src/predylogic/**"
      instructions: >-
        Enforce the tach dependency stack (higher may depend on lower, never
        the reverse): rule_engine -> register -> predicate -> trace -> typedefs.
        Each submodule raises from its own errs.py. Require precise types — no
        Any / bare dict / list / tuple without a documented reason; prefer
        TypedDict / dataclass / Protocol. Errors must fail loudly on internal
        paths (no silent fallbacks or catch-and-continue). Imports belong at
        module top level. Public API needs Google-style docstrings whose
        signature + doc suffice without reading the body. When a node type or
        contract changes, verify every caller and the parallel schema updates
        (typedefs.PredicateNodeType, the compiler, rule_engine base/schema,
        Trace rendering) are all present.
    - path: "sdks/python/tests/**"
      instructions: >-
        A behavior is tested only with all three: a positive case asserting
        specific values (not truthiness / "no exception"), a negative case
        asserting the specific error type or message, and boundaries
        (empty / one / many / off-by-one). Tests must not mock the unit under
        test. Concurrency changes must keep test_concurrency.py green — flag
        atomicity regressions in PredicateHandle / get_predicate_handle.
    - path: "sdks/python/benchmarks/**"
      instructions: >-
        Benchmarks feed the CodSpeed baseline. Flag changes that would skew
        measurement (added setup in the timed path, non-representative inputs)
        or that mask a real fast-path regression.
    - path: "crates/**/*.rs"
      instructions: >-
        Idiomatic Rust: no unwrap/expect/panic on recoverable paths in library
        code — return Result and propagate with `?`, adding context. Inspect
        errors by type, not string matching. Prefer borrowing over cloning.
        Keep it clippy-clean.

  tools:
    ruff:
      enabled: true

chat:
  auto_reply: true
