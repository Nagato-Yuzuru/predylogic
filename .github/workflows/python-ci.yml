name: python-ci.yml
on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, ready_for_review ]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      # A PR answers only for the files it changes (HEAD^1 is the base side of the
      # merge commit); pushes to main check the whole tree.
      - name: Run prek
        uses: j178/prek-action@v2
        with:
          extra-args: ${{ github.event_name == 'pull_request' && '--from-ref HEAD^1 --to-ref HEAD' || '--all-files' }}

      - name: Run checks
        run: just py-check

  tests-and-type-check:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --directory sdks/python pytest tests --cov=src --cov-config=pyproject.toml --cov-report=xml

      - name: Check typing
        run: uv run ty check

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./sdks/python/coverage.xml
          flags: python
          fail_ci_if_error: true

  check-docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check if documentation can be built
        run: uv run mkdocs build -s
