name: release-main

on:
  push:
    tags:
      - "sdks/python/v*"

permissions:
  contents: write

jobs:
  github-release:
    name: Create Draft GitHub Release
    runs-on: ubuntu-latest
    steps:
      # CHANGELOG.md is written before tagging (`just py-changelog`) and lands through a
      # PR, so this job only reads the tagged commit and never pushes to main.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes (latest tag only)
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: cliff-latest
        with:
          config: sdks/python/cliff.toml
          args: --verbose --latest --strip header

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.cliff-latest.outputs.content }}
          draft: true
          prerelease: false
