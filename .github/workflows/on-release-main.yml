name: release-main

on:
  push:
    tags:
      - "sdks/python/v*"

permissions:
  contents: write

jobs:
  github-release:
    name: Create Draft GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Generate release notes (latest tag only)
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: cliff-latest
        with:
          config: sdks/python/cliff.toml
          args: --verbose --latest --strip header

      - name: Regenerate full CHANGELOG.md
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: sdks/python/cliff.toml
          args: --verbose
        env:
          OUTPUT: sdks/python/CHANGELOG.md

      - name: Install prek
        uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          install-only: true

      # git-cliff ends the file with a blank line, which end-of-file-fixer rejects on every
      # PR. The first run fixes (and exits 1 if it changed anything); the second must pass.
      - name: Normalize CHANGELOG.md with the repo's fixers
        run: |
          normalize() { prek run end-of-file-fixer trailing-whitespace --files sdks/python/CHANGELOG.md; }
          normalize || normalize

      - name: Commit CHANGELOG back to main
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdks/python/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md unchanged; skipping commit."
          else
            git commit -m "chore(changelog): update for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.cliff-latest.outputs.content }}
          draft: true
          prerelease: false
